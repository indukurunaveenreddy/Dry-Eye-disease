name: OculoAI Test & Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate Python scripts syntax
      run: |
        python -m py_compile app.py
        python -m py_compile "Dry Eye Disease/Source Code/Eye DIsease/Login.py"
        python -m py_compile "Dry Eye Disease/Source Code/Eye DIsease/Prediction.py"
        python -m py_compile "Dry Eye Disease/Source Code/Eye DIsease/ui_theme.py"
        echo "All scripts compiled successfully!"

    - name: Smoke test model and datasets
      run: |
        python -c "
        import pickle, sqlite3, os
        print('Checking SQLite DB...')
        conn = sqlite3.connect('users.db')
        cur = conn.cursor()
        cur.execute('SELECT COUNT(*) FROM users')
        print(f'Users count: {cur.fetchone()[0]}')
        conn.close()

        print('Checking ML model file.pickle...')
        model = pickle.load(open('file.pickle', 'rb'))
        print('Model loaded successfully:', type(model))
        "
