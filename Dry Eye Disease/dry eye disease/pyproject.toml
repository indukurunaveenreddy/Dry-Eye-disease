[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data/raw", "artifacts", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG"]
ignore = [
    "E501",
    "B008",
    "ARG001",
    "ARG002",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "SIM117"]
"app/app.py" = ["E402"]
"scripts/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"